<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="">
<title>Contact — Guanyang</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="contact">

<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="index.html" aria-label="Guanyang home">
      <span class="brand-mark">冠</span>
      <span class="brand-name"><span class="cn" data-i18n="brand.cn">冠阳</span><br><span class="en" data-i18n="brand.en">GUANYANG</span></span>
    </a>
    <nav class="main-nav" id="mainNav">
      <a href="index.html" data-i18n="nav.home">Home</a>
      <a href="about.html" data-i18n="nav.about">About Us</a>
      <a href="products.html" data-i18n="nav.products">Products</a>
      <a href="factory.html" data-i18n="nav.factory">Factory</a>
      <a href="contact.html" class="active" data-i18n="nav.contact">Contact</a>
    </nav>
    <div class="header-right">
      <div class="lang-switch"></div>
      <button class="nav-toggle" aria-label="menu">☰</button>
    </div>
  </div>
</header>

<section class="page-hero">
  <div class="container">
    <div class="kicker" data-i18n="pg.ct.kicker"></div>
    <h1 data-i18n="pg.ct.title"></h1>
    <p data-i18n="pg.ct.lead"></p>
  </div>
</section>

<section class="section">
  <div class="container">
    <div class="contact-cards">
      <div class="contact-card">
        <div class="ico">📍</div>
        <h3 data-i18n="c.addr.t"></h3>
        <p data-i18n="c.addr.v"></p>
      </div>
      <div class="contact-card">
        <div class="ico">📞</div>
        <h3 data-i18n="c.tel.t"></h3>
        <p data-i18n="c.tel.v"></p>
      </div>
      <div class="contact-card">
        <div class="ico">✉️</div>
        <h3 data-i18n="c.mail.t"></h3>
        <p data-i18n="c.mail.v"></p>
      </div>
      <div class="contact-card" data-show-lang="zh">
        <div class="ico">🎵</div>
        <h3 data-i18n="c.douyin.t"></h3>
        <p><a href="https://www.douyin.com/user/MS4wLjABAAAAktVSM_6uh2ABfnxMpLBJjvQ6svc-g7vbsrSdPSEewDM" target="_blank" rel="noopener" data-i18n="c.douyin.v"></a></p>
      </div>
      <div class="contact-card" data-show-lang="zh">
        <div class="ico">💬</div>
        <h3 data-i18n="c.wechat.t"></h3>
        <p data-i18n="c.wechat.v"></p>
      </div>
    </div>
    <div class="note" data-i18n="c.note"></div>
  </div>
</section>

<footer class="site-footer">
  <div class="container">
    <div class="footer-grid">
      <div>
        <div class="brand" style="margin-bottom:14px">
          <span class="brand-mark">冠</span>
          <span class="brand-name"><span class="cn" data-i18n="brand.cn">冠阳</span><br><span class="en" data-i18n="brand.en">GUANYANG</span></span>
        </div>
        <p data-i18n="f.about.d"></p>
        <p style="margin-top:10px;color:#7d838d" data-i18n="f.tag"></p>
      </div>
      <div>
        <h4 data-i18n="f.nav.t"></h4>
        <ul>
          <li><a href="index.html" data-i18n="nav.home"></a></li>
          <li><a href="about.html" data-i18n="nav.about"></a></li>
          <li><a href="products.html" data-i18n="nav.products"></a></li>
          <li><a href="factory.html" data-i18n="nav.factory"></a></li>
          <li><a href="contact.html" data-i18n="nav.contact"></a></li>
        </ul>
      </div>
      <div>
        <h4 data-i18n="f.contact.t"></h4>
        <ul>
          <li data-i18n="c.addr.v"></li>
          <li><span data-i18n="c.tel.t"></span>: <span data-i18n="c.tel.v"></span></li>
          <li><span data-i18n="c.mail.t"></span>: <span data-i18n="c.mail.v"></span></li>
          <li data-show-lang="zh"><span data-i18n="c.douyin.t"></span>: <a href="https://www.douyin.com/user/MS4wLjABAAAAktVSM_6uh2ABfnxMpLBJjvQ6svc-g7vbsrSdPSEewDM" target="_blank" rel="noopener" data-i18n="c.douyin.v"></a></li>
          <li data-show-lang="zh"><span data-i18n="c.wechat.t"></span>: <span data-i18n="c.wechat.v"></span></li>
        </ul>
      </div>
    </div>
    <div class="footer-bottom"><span data-i18n="f.rights"></span></div>
  </div>
</footer>

<script src="assets/js/i18n.js"></script>
</body>
</html>
